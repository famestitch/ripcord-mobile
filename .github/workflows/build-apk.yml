# GitHub Actions se free me APK banao — apne PC/phone par kuch install nahi karna.
# Steps:
# 1. Is folder ko GitHub repo me push karo (root me pubspec.yaml hona chahiye).
# 2. Repo kholo → Actions tab → "Build APK" → Run workflow (ya push par auto).
# 3. Job khatam hone par Artifacts se "ripcord-mobile-apk" download karo (phone browser se bhi).
# 4. APK install karo (unknown sources allow karna padega). DEBUG build hai — testing ke liye.
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ripcord-mobile-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
