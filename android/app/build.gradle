plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.ripcord.mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.ripcord.mobile"
        // record plugin needs minSdk 23 (Opus voice). Is se neeche install nahi hoga.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Debug key se signed release — apne phone par turant install hoga.
            // Play Store ke liye apni keystore lagao.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
